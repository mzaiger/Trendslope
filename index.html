<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trendslope</title>
<link rel="icon" type="image/gif" href="favicon.gif">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fonts.css">
<style>
:root{--bg:#fff;--panel:#F2F7FD;--line:#D9E5F2;--text:#10233F;--dim:#64798E;--blue:#1B63E0;--radius:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
/* boogie header */
.disco{position:relative;overflow:hidden;color:#fff;background:linear-gradient(120deg,#2a0a4a,#6a11cb 35%,#ff2fa0 70%,#ffb347);background-size:300% 300%;animation:shift 12s ease infinite;clip-path:polygon(0 0,100% 0,100% 78%,0 100%);padding-bottom:46px}
@keyframes shift{50%{background-position:100% 50%}}
.disco:before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.35) 1px,transparent 2px) 0 0/26px 26px;animation:twinkle 2.4s linear infinite;opacity:.5}
@keyframes twinkle{50%{opacity:.15}}
.hero{position:relative;max-width:1700px;margin:0 auto;padding:18px 24px 10px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hero img{width:240px;max-width:44vw;height:auto;border-radius:14px;border:3px solid #00ffd0;box-shadow:0 0 24px #ff2fa0,0 0 8px #00ffd0;transform:rotate(-3deg)}
h1{font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(40px,9vw,84px);line-height:.9;margin:0;letter-spacing:.03em;text-shadow:3px 3px 0 #ff2fa0,6px 6px 0 #1B63E0,0 0 28px #fff8}
.tag{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin:10px 0 0;color:#00ffd0}
.marq{position:relative;white-space:nowrap;overflow:hidden;font-family:Oswald;letter-spacing:.2em;font-size:13px;opacity:.9;padding:4px 0}
.marq span{display:inline-block;animation:mq 28s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
main{max-width:1700px;margin:0 auto;padding:0 24px 60px}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;padding:10px 0;background:linear-gradient(var(--bg) 78%,transparent)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{font-family:Oswald;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:13px;color:var(--dim);background:none;border:0;border-radius:999px;padding:7px 15px}
.tab.on{background:var(--blue);color:#fff}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim)}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--blue);border-radius:6px;padding:6px 11px;font-family:'IBM Plex Mono',monospace;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:8px}
.tc{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(16,35,63,.04);color:inherit;text-decoration:none}
.tc:hover{border-color:var(--blue)}
.th{position:relative;aspect-ratio:4/3;background:var(--panel);overflow:hidden;display:flex;align-items:center;justify-content:center}
.th img{width:100%;height:100%;object-fit:cover}
.th.logo img{object-fit:contain;padding:18px}
.th .fb{font-family:Oswald;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-size:12px;padding:10px;text-align:center}
.pill{position:absolute;left:8px;bottom:8px;border-radius:999px;padding:3px 10px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:#fff}
.when{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
.star{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:999px;width:30px;height:30px;font-size:16px;line-height:1;color:#bbb}
.star.on{color:#F2A93B}
.bd{padding:10px 12px 12px}
.bd b{display:block;font-size:14px;line-height:1.3}
.bd span{display:block;color:var(--dim);font-size:12.5px;margin-top:4px;font-family:'IBM Plex Mono',monospace;line-height:1.45}
.grid{align-items:start}
.tile{display:block;min-width:0}
.tile.w2{grid-column:span 2}
@media(max-width:560px){.tile.w2{grid-column:span 1}}
.daydiv{grid-column:1/-1;margin-top:14px;padding:7px 16px;border-radius:10px;color:#fff;font-family:Oswald,sans-serif;font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(100deg,#2a0a4a,#6a11cb 45%,#ff2fa0);box-shadow:0 2px 10px rgba(106,17,203,.25)}
.daydiv small{font-family:'IBM Plex Mono',monospace;letter-spacing:.05em;opacity:.8;margin-left:10px;font-size:11px;text-transform:none}
</style></head><body>
<header class="disco">
 <div class="hero">
  <img src="runner.gif" alt="Trendslope runner">
  <div><h1>Trendslope</h1><p class="tag">Run the slope · dodge the noise · catch the trends</p></div>
 </div>
 <div class="marq"><span id="mq"></span></div>
</header>
<main>
 <div class="controls">
  <div class="tabs" id="tabs"></div>
  <div class="tabs" id="ranges"></div>
  <div class="mono"><span id="count"></span> <button class="btn" id="dietbtn">Diet start date</button></div>
 </div>
 <div class="grid" id="grid"></div>
</main>
<script src="picks-store.js"></script>
<script src="diet-shared.js"></script>
<script>
// ===== CONFIG: change repo names / branch here =====
const U='mzaiger', BRANCH='main';

const TREND_FILES=[['social_media_trends.json','social_media'],['google_trends.json','google'],['reddit_trends.json','reddit']];
const DIET_CREATED='2026-11-02'; // SingleManDiet repo's first commit; change if you like
const COLORS={diet:'#1E9E5A',deals:'#D9480F',sports:'#1B63E0',movies:'#7B2CBF',music:'#E0359B',software:'#0B7285',trends:'#F08C00'};

// ===== helpers =====
const DAY=864e5, now=Date.now();
const gc=(k,f)=>{const m=document.cookie.match('(?:^|; )'+k+'=([^;]*)');try{return m?JSON.parse(decodeURIComponent(m[1])):f}catch{return f}};
const sc=(k,v)=>{document.cookie=`${k}=${encodeURIComponent(JSON.stringify(v))};max-age=31536000;path=/;SameSite=Lax`};
const hs=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967296};
const J=async u=>{try{const r=await fetch(u+'?v='+Math.floor(now/3e5));return r.ok?await r.json():null}catch{return null}};
const pick=o=>({title:o.title||o.name||o.topic||o.query||o.meal||o.item||'',img:o.image||o.img||o.poster||o.thumb||o.logo||'',url:o.url||o.link||'',desc:o.desc||o.description||o.summary||''});
const arr=(o,d=0)=>{if(Array.isArray(o)&&o.length>2&&o[0]&&typeof o[0]=='object'&&pick(o[0]).title)return o;if(o&&typeof o=='object'&&d<4)for(const v of Object.values(o)){const r=arr(v,d+1);if(r)return r}};
const lim=(a,n)=>a.slice(0,n);
let S={tab:gc('ts_tab','live'),range:gc('ts_range',3),favs:gc('ts_favs',[]),created:gc('ts_created',DIET_CREATED)};
let ITEMS=[], DIET=[];
// ===== favorites: same localStorage keys/formats as each site, so they show on the other pages =====
const LS=(k,f)=>{try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch{return f}},LW=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const mut=(k,fb,fn)=>{const o=LS(k,fb);fn(o);LW(k,o)};
const FAV={
 movies:{is:i=>LS('movies_favs',[]).includes(i.raw.id),set:(i,on)=>mut('movies_favs',[],a=>{const x=new Set(a);on?x.add(i.raw.id):x.delete(i.raw.id);a.length=0;a.push(...x)})},
 music:{is:i=>('all:'+i.raw.id)in LS('music_favs',{}),set:(i,on)=>mut('music_favs',{},o=>{const k='all:'+i.raw.id;on?o[k]={...i.raw,rank:i.rank,src:'all'}:delete o[k]})},
 software:{is:i=>(i.f+':'+i.raw.id)in LS('software_favs2',{}),set:(i,on)=>mut('software_favs2',{},o=>{const k=i.f+':'+i.raw.id;on?o[k]={...i.raw,src:i.f}:delete o[k]})},
 trends:{is:i=>(i.sk+'|'+i.raw.id)in LS('trending_favorites',{}),set:(i,on)=>mut('trending_favorites',{},o=>{const u=i.sk+'|'+i.raw.id;on?o[u]={...i.raw,source:i.sk,uid:u}:delete o[u]})},
 deals:{is:i=>i.raw.link in LS('slickdeals_favorites',{}),set:(i,on)=>mut('slickdeals_favorites',{},o=>{on?o[i.raw.link]=i.raw:delete o[i.raw.link]})}};
const isFav=i=>FAV[i.src]?FAV[i.src].is(i):false;
const SC={};
// ===== loaders (each pushes items and re-renders as it arrives) =====
const add=(a)=>{ITEMS.push(...a);render()};
async function movies(){const b=RAW(SITE.movies),ix=await J(b+'index.json');if(!ix)return;
 for(const m of lim(ix.months,2)){const d=await J(`${b}data/${m.m}.json`);if(d)add(d.items.map((i,n)=>({id:'mv'+i.id,src:'movies',raw:i,rank:n+1,title:i.title})))}}
async function music(){const d=await J(RAW(SITE.music)+'data/all.json');if(d)add(d.items.map((i,n)=>({id:'mu'+i.id,src:'music',raw:i,rank:i.rank||n+1,title:i.title})))}
async function software(){for(const f of['github','steam','itunes']){const d=await J(RAW(SITE.software)+`data/${f}.json`);if(d)add(lim(d.items,40).map((i,n)=>({id:'sw'+f+i.id,src:'software',f,raw:i,rank:(i.ranks&&i.ranks['3'])||n+1,title:i.title})))}}
async function deals(){try{const r=await fetch(RAW(SITE.deals)+'deals.xml?v='+Math.floor(now/3e5));const x=new DOMParser().parseFromString(await r.text(),'text/xml');
 add([...x.querySelectorAll('deal')].map(e=>{const g=t=>(e.querySelector(t)?.textContent||'').trim(),p=Date.parse(g('pubDateIso'));return{id:'dl'+g('link').slice(-50),src:'deals',title:g('title'),raw:{title:g('title'),link:g('link'),thumbnail:g('thumbnail'),rating:+g('rating')||0,description:g('description'),pubDateIso:g('pubDateIso')},ts:isNaN(p)?undefined:p}}).filter(i=>i.raw.link))}catch{}}
async function sports(){const SP={nfl:'nfl',nhl:'nhl',mlb:'mlb',nba:'nba',ncaaf:'cfb',ncaamb:'ncaamb'};for(const l of Object.keys(SP)){const d=await J(RAW(SITE.sports)+`data/${l}_dashboard.json`);if(!d)continue;const out=[];
 for(const w of d.weeks||[])for(const dy of w.days||[])for(const sl of dy.time_slots||[]){const gs=sl.games||[];if(!gs.length)continue;const pk=gs.find(g=>g.is_slot_pick)||gs[0];
  for(const g of gs)out.push({id:'sp'+SP[l]+g.id,src:'sports',pick:g===pk?1:0,raw:g,sport:SP[l],title:`${g.away_abbr||g.away_team} @ ${g.home_abbr||g.home_team}`,ts:Date.parse(g.start_time)})}
 add(out)}}
async function scores(){for(const sp of['nfl','nhl','mlb','nba','cfb','ncaamb'])SC[sp]=await PS.fetchScores(sp);render()}
async function trends(){for(const[f,l]of TREND_FILES){const d=await J(RAW(SITE.trends)+f);if(!d)continue;
 add((d.items||[]).map(o=>{const t=Date.parse(o.started_trending||o.first_seen);return{id:'tr'+l+o.id,src:'trends',sk:l,raw:o,title:o.topic,ts:isNaN(t)?undefined:t}}))}}
async function diet(){const b=RAW(SITE.diet),[f,c]=await Promise.all([J(b+'meals.json'),J(b+'candidate_pool.json')]);
 const mk=(a,n,fz)=>a.filter(i=>i.active!==false&&+i.calories>=150).map(i=>({name:i.name||i.PRODUCT_NAME,img:i.image_url,url:i.PRODUCT_URL||'',cal:i.calories,where:i.restaurant||i.BRAND||'Frozen',bk:n(i),fz:fz,full:i,price:i.price??i.PRICE_CURRENT,serving:i.serving||i.servings_per_container}));
 for(const[k,v]of Object.entries(f?.restaurants||{}))if(v.site)DS.sites[k]=v.site;
 DIET=[...mk(f?.meals||[],i=>i.category=='breakfast',false),...mk(c||[],i=>/breakfast|egg|pancake|waffle|french toast|biscuit/i.test(i.PRODUCT_NAME),true)].filter(m=>m.name);render()}
// ===== diet schedule: weeks start on the Monday after the creation date =====
function dietItems(R,lo){if(!DIET.length)return[];const out=[];const today=new Date();today.setHours(0,0,0,0);
 let start=null;if(S.created){const c=new Date(S.created+'T00:00:00');c.setDate(c.getDate()+((8-c.getDay())%7||7));start=c}
 const days=Math.min(R,7);
 for(let k=days-1;k>=0;k--){const d=new Date(today.getTime()-k*DAY);const wk=start?Math.max(0,Math.floor((d-start)/(7*DAY))):0;
  SLOTS.forEach(([nm,h],si)=>{const key=nm.split(' ')[0].toLowerCase();const ok=si==0?m=>m.bk:si==1?m=>true:m=>!m.bk;let pool=DIET.filter(ok);if(!pool.length)pool=DIET;
   const o=pool[Math.floor(hs(`${wk}-${d.getDay()}-${si}`)*pool.length)],p={title:o.name,img:o.img,url:o.url};const t=new Date(d);t.setHours(h,0,0,0);
   out.push({id:`di${wk}-${d.getDay()}-${si}`,src:'diet',raw:o,slot:nm,h,title:p.title,img:p.img,sub:`${nm} · ${(h%12||12)}:00 ${h<12?'AM':'PM'} · ${o.where} · ${o.cal} cal`,url:p.url,ts:t.getTime(),today:d.getTime()==today.getTime()})})}
 return out}

// ===== tile renderers: same markup as each site's own page =====
const ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'},esc=x=>String(x??'').replace(/[&<>"']/g,c=>ESC[c]);
const safeUrl=u=>{try{const x=new URL(u);return/^https?:$/.test(x.protocol)?x.href:''}catch{return''}};
const fmtNum=n=>Number(n).toLocaleString('en-US'),cmp=n=>Intl.NumberFormat('en-US',{notation:'compact',maximumFractionDigits:1}).format(n);
const fmtDate=d=>d?new Date(d+'T00:00:00Z').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'}):'';
const money=v=>{if(v==null)return'\u2014';const k=Math.round(v/1e3);if(k>=1e6)return`$${Math.round(v/1e9)}B`;if(k>=1e3){const m=Math.round(v/1e6);return m>=1e3?`$${Math.round(v/1e9)}B`:`$${m}M`}return`$${k}K`};
const rel=iso=>{const t=Date.parse(iso);if(isNaN(t))return'\u2014';const m=Math.max(0,Math.round((now-t)/6e4));return m<60?m+'m ago':m<1440?Math.floor(m/60)+'h ago':Math.floor(m/1440)+'d ago'};
const favT=i=>`<label class="fav-toggle" title="Favorite"><input type="checkbox" class="fav-input" data-id="${esc(i.id)}" ${isFav(i)?'checked':''}><span class="fav-star">\u2605</span></label>`;
const FB='onerror="this.outerHTML=\'<div class=&quot;thumb-fallback&quot;>No Image</div>\'"';
const imgT=u=>{u=safeUrl(u);return u?`<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer" ${FB}>`:'<div class="thumb-fallback">No Image</div>'};
const TS={social_media:{l:'Social Media',o:'Search posts \u2197'},google:{l:'Google',o:'Search Google \u2197'},reddit:{l:'Reddit',o:'Open on Reddit \u2197'}};
const chg=it=>{if(it.is_new)return'<span class="chg new">NEW</span>';const c=it.rank_change;if(typeof c!='number')return'';return c>0?`<span class="chg up">\u25b2 ${c}</span>`:c<0?`<span class="chg down">\u25bc ${-c}</span>`:'<span class="chg same">\u2013</span>'};
const SW={github:{open:'Open on GitHub',m:it=>`<b>\u2605 ${fmtNum(it.metric)}</b> stars`},steam:{open:'Open on Steam',m:it=>`<b>\u{1F3AE} ${fmtNum(it.metric)}</b> playing`},itunes:{open:'Open on App Store',m:it=>`<b>Apple #${it.metric}</b> chart`}};
const SPORTS=(()=>{const DISPLAY_TZ=PS.DISPLAY_TZ;
const MULTI_WORD_MASCOTS = new Set(['Red Wings','Blue Jackets','Maple Leafs','Golden Knights','Trail Blazers','Blue Jays','Red Sox','White Sox','Crimson Tide','Fighting Irish','Golden Gophers','Scarlet Knights','Blue Devils','Tar Heels','Demon Deacons','Yellow Jackets','Horned Frogs','Red Raiders','Sun Devils','Nittany Lions','Golden Eagles','Green Wave','Blue Hens','Mean Green','Black Knights','Golden Flashes','Thundering Herd','Rainbow Warriors','Fighting Illini','Red Wolves','Blue Raiders','Golden Hurricane','Wolf Pack','Fighting Hawks','Mountain Hawks','Golden Bears','Red Storm','Blue Jays','Fighting Camels','Delta Devils','Ragin Cajuns','Runnin Rebels','Golden Panthers','Big Green','Crimson Hawks','Seminoles']);
const LOGO_ON_WHITE = new Set(['Penn State Nittany Lions','Iowa Hawkeyes','Ohio State Buckeyes','Texas A&M Aggies','Cincinnati Bearcats','Utah State Aggies','Wake Forest Demon Deacons','Kansas State Wildcats','Michigan State Spartans','Nevada Wolf Pack','Nevada Wolfpack','New York Giants','New York Jets','Los Angeles Rams','Carolina Panthers','San Diego Padres','New York Yankees','Colorado Rockies','Detroit Tigers','Kansas City Royals','Minnesota Twins','Oakland Athletics','Athletics','Washington Capitals','Tampa Bay Lightning','Toronto Maple Leafs','Dallas Stars','Utah Jazz','California Golden Bears','Virginia Cavaliers','Charlotte 49ers','Rice Owls','Baylor Bears','TCU Horned Frogs','West Virginia Mountaineers','New Mexico State Aggies','Toledo Rockets','San Diego State Aztecs']);
function fmtAmerican(n) {
  if (n === null || n === undefined || n === '') return null;
  const num = Number(n);
  if (Number.isNaN(num)) return null;
  return num > 0 ? `+${num}` : `${num}`;
}
function fmtLine(n) {
  if (n === null || n === undefined || n === '') return null;
  const num = Number(n);
  if (Number.isNaN(num)) return null;
  return num > 0 ? `+${num}` : `${num}`;
}
function oddsCell(entry) {
  if (!entry || (entry.line === undefined && entry.american === undefined)) {
    return '<span class="empty-cell">—</span>';
  }
  const line = fmtLine(entry.line);
  const am = fmtAmerican(entry.american);
  const negCls = (typeof entry.american === 'number' && entry.american < 0) ? 'neg' : '';
  if (line !== null && am !== null) return `${line}<span class="num num-am ${negCls}">(${am})</span>`;
  if (am !== null) return `<span class="num ${negCls}">${am}</span>`;
  if (line !== null) return line;
  return '<span class="empty-cell">—</span>';
}
function rankBadge(rank) {
  // No rank -> keep an invisible badge of the same size so the logo/name/record
  // columns don't shift between ranked and unranked teams.
  return rank ? `<span class="rank">#${rank}</span> ` : '<span class="rank rank-empty" aria-hidden="true">#00</span> ';
}
function splitTeamName(name, location) {
  if (!name) return ['', ''];
  if (location && name.length > location.length + 1 && name.startsWith(location + ' ')) {
    return [location, name.slice(location.length + 1)];
  }
  const words = name.split(' ');
  if (words.length < 2) return [name, ''];
  if (words.length > 2 && MULTI_WORD_MASCOTS.has(words.slice(-2).join(' '))) {
    return [words.slice(0, -2).join(' '), words.slice(-2).join(' ')];
  }
  return [words.slice(0, -1).join(' '), words[words.length - 1]];
}
function teamNameBlock(name, record, scoreBadge, pitcher, logo, location) {
  const recordHtml = record ? `<span class="team-record">${record}</span>` : '';
  const [nameTop, nameBottom] = splitTeamName(name, location);
  const nameHtml = nameBottom ? `<span class="tn-loc">${nameTop}</span> <span class="tn-mascot">${nameBottom}</span>` : nameTop;
  const logoHtml = logo ? `<img class="team-logo${LOGO_ON_WHITE.has(name) ? ' logo-white' : ''}" src="${logo}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : '';
  return `${logoHtml}<span class="team-name-wrap"><span class="team-name-line"><span class="team-name">${nameHtml}</span>${scoreBadge || ''}</span>${recordHtml}</span>`;
}
function kickoffTime(iso, tbd) {

  try {

    const day = d.toLocaleDateString('en-US', { timeZone: DISPLAY_TZ, weekday: 'short', month: 'short', day: 'numeric' });
    const time = d.toLocaleTimeString('en-US', { timeZone: DISPLAY_TZ, hour: 'numeric', minute: '2-digit', timeZoneName: 'short' });

  } catch (e) { return ''; }
}

function heatClass(rating) {
  if (rating >= 50) return 'hot';
  if (rating >= 20) return 'warm';
  return 'cool';
}
function heatColor(rating) {

}

function providerKey(name) {
  return String(name).toLowerCase()
    .replace(/\s+(amazon|apple tv|roku premium|youtube primetime)\s+channel$/, '')   // "Max Amazon Channel" -> "max"
    .replace(/\s+apple tv$/, '')                                                     // "Acorn TV Apple TV" -> "acorn tv"
    .replace(/\s+(standard |basic |premium )?with ads$/, '')                         // "Netflix Standard with Ads" -> "netflix"
    .replace(/\s+(premium plus|premium|basic|standard|essential|select)$/, '')       // "Peacock Premium" -> "peacock"
    .trim();
}

// One link per service, in TMDb's order. Services we have no search URL for share a single JustWatch link.
function watchLinks(m) {
  const t = encodeURIComponent(m.title), seen = new Set(), out = [];
  let other = false;
  (m.stream || []).forEach(n => {
    const key = providerKey(n), sv = SERVICES.find(x => x.re.test(key));
    if (!sv) { other = true; return; }
    if (seen.has(sv.k)) return;
    seen.add(sv.k);
    out.push({ href: sv.url(t), domain: sv.domain, img: sv.img, name: sv.name });
  });
  if (other) out.push({ href: `https://www.justwatch.com/us/search?q=${t}`, domain: 'justwatch.com', name: 'JustWatch' });
  return [{ href: `https://www.fandango.com/search?q=${t}`, domain: 'fandango.com', name: 'Fandango' }, ...out];   // tickets first, then the streaming services
}
