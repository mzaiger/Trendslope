<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=0.85">
<title>Trendslope</title>
<link rel="icon" type="image/gif" href="favicon.gif">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;900&family=Permanent+Marker&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fonts.css">
<style>
:root{--bg:#fff;--panel:#F2F7FD;--line:#D9E5F2;--text:#10233F;--dim:#64798E;--blue:#1B63E0;--radius:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
/* boogie header */
.disco{position:relative;overflow:hidden;color:#fff;background:linear-gradient(120deg,#2a0a4a,#6a11cb 35%,#ff2fa0 70%,#ffb347);background-size:300% 300%;animation:shift 12s ease infinite;--rise:60px;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--rise)),0 100%);padding-bottom:calc(var(--rise) + 40px)}
@keyframes shift{50%{background-position:100% 50%}}
.disco:before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.35) 1px,transparent 2px) 0 0/26px 26px;animation:twinkle 2.4s linear infinite;opacity:.5}
@keyframes twinkle{50%{opacity:.15}}
.hero{position:relative;max-width:1700px;margin:0 auto;padding:18px 24px 10px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hero img{width:240px;max-width:44vw;height:auto;border-radius:14px;border:3px solid #00ffd0;box-shadow:0 0 24px #ff2fa0,0 0 8px #00ffd0;transform:rotate(-3deg)}
h1{font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(40px,9vw,84px);line-height:.9;margin:0;letter-spacing:.03em;text-shadow:3px 3px 0 #ff2fa0,6px 6px 0 #1B63E0,0 0 28px #fff8}
.tag{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin:10px 0 0;color:#00ffd0}
.slope{will-change:transform;position:absolute;left:0;top:0;height:30px;line-height:30px;transform-origin:0 100%;white-space:nowrap;overflow:hidden;z-index:2;pointer-events:none}
.slope .tr{display:inline-block;font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.22em;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.4);animation:mq 90s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
main{max-width:1700px;margin:0 auto;padding:0 24px 60px}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;padding:10px 0;background:linear-gradient(var(--bg) 78%,transparent)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{font-family:Oswald;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:13px;color:var(--dim);background:none;border:0;border-radius:999px;padding:7px 15px}
.tab.on{background:var(--blue);color:#fff}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim)}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--blue);border-radius:6px;padding:6px 11px;font-family:'IBM Plex Mono',monospace;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin-top:8px}
.tc{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(16,35,63,.04);color:inherit;text-decoration:none}
.tc:hover{border-color:var(--blue)}
.th{position:relative;aspect-ratio:4/3;background:var(--panel);overflow:hidden;display:flex;align-items:center;justify-content:center}
.th img{width:100%;height:100%;object-fit:cover}
.th.logo img{object-fit:contain;padding:18px}
.th .fb{font-family:Oswald;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-size:12px;padding:10px;text-align:center}
.pill{position:absolute;left:8px;bottom:8px;border-radius:999px;padding:3px 10px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:#fff}
.when{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
.star{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:999px;width:30px;height:30px;font-size:16px;line-height:1;color:#bbb}
.star.on{color:#F2A93B}
.bd{padding:10px 12px 12px}
.bd b{display:block;font-size:14px;line-height:1.3}
.bd span{display:block;color:var(--dim);font-size:12.5px;margin-top:4px;font-family:'IBM Plex Mono',monospace;line-height:1.45}
.grid{align-items:start}
.tile{display:block;min-width:0}
.tile.w2{grid-column:span 2}
@media(max-width:560px){.tile.w2{grid-column:span 1}}
.daydiv{grid-column:1/-1;margin-top:14px;padding:7px 16px;border-radius:10px;color:#fff;font-family:Oswald,sans-serif;font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(100deg,#2a0a4a,#6a11cb 45%,#ff2fa0);box-shadow:0 2px 10px rgba(106,17,203,.25)}
.daydiv small{font-family:'IBM Plex Mono',monospace;letter-spacing:.05em;opacity:.8;margin-left:10px;font-size:11px;text-transform:none}
.srcs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.chip2{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--dim);border-radius:999px;padding:4px 13px;font:600 12px Oswald,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.chip2.on{color:#fff;border-color:transparent}

body{position:relative}
#menu{position:absolute;top:16px;right:20px;z-index:60;display:flex;gap:8px;flex-wrap:nowrap}
#menu a{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:rgba(20,5,40,.35);border:1px solid rgba(255,255,255,.3);color:#fff;text-decoration:none;font:600 12px Oswald,sans-serif;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#menu a:hover{background:#fff;color:#4a0e8f}
#menu a i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
#burger{display:none;position:absolute;top:14px;right:14px;z-index:61;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(20,5,40,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer;padding:0;align-items:center;justify-content:center;flex-direction:column;gap:5px}
#burger span{display:block;width:20px;height:2px;border-radius:2px;background:#fff;transition:transform .2s,opacity .2s}
#burger[aria-expanded=true] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
#burger[aria-expanded=true] span:nth-child(2){opacity:0}
#burger[aria-expanded=true] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
@media(max-width:1279px){
 #burger{display:flex}
 #menu{display:none;flex-direction:column;top:66px;right:14px;gap:2px;padding:8px;border-radius:14px;background:linear-gradient(135deg,#2a0a4a,#5b0fb8);box-shadow:0 14px 34px rgba(0,0,0,.45);min-width:240px;max-width:calc(100vw - 28px)}
 #menu.open{display:flex}
 #menu a{border:0;background:none;border-radius:10px;padding:12px 12px;font-size:13px;-webkit-backdrop-filter:none;backdrop-filter:none}
 #menu a:hover{background:rgba(255,255,255,.14);color:#fff}}
#siteview{display:none}
#siteview iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#back{display:none;position:fixed;left:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:400;align-items:center;gap:.4rem;font:600 .78rem system-ui,-apple-system,sans-serif;color:#fff;background:linear-gradient(100deg,#2a0a4a,#6a11cb);border:1px solid #8e2de2;border-radius:999px;padding:.4rem .8rem;cursor:pointer;box-shadow:0 10px 24px -12px rgba(0,0,0,.6)}
#back:hover{border-color:#ff2fa0;color:#ffd0ec}
#back svg{width:.95rem;height:.95rem;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.site-mode{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
body.site-mode main,body.site-mode #menu,body.site-mode #burger{display:none}
body.site-mode .disco{flex:none;padding-bottom:calc(var(--rise) + 32px)}
body.site-mode .hero{padding:8px 16px 0;gap:12px;flex-wrap:nowrap}
body.site-mode .hero img{width:84px;max-width:84px;border-width:2px;box-shadow:0 0 14px #ff2fa0}
body.site-mode h1{font-size:clamp(24px,6vw,40px);text-shadow:2px 2px 0 #ff2fa0,3px 3px 0 #1B63E0}
body.site-mode .tag{display:none}
body.site-mode #siteview{display:block;flex:1 1 auto;min-height:0;position:relative}
body.site-mode #back{display:flex}
</style></head><body>
<header class="disco">
 <div class="hero">
  <img src="runner.gif" alt="Trendslope runner" width="240" height="160">
  <div><h1>Trendslope</h1><p class="tag">Run the slope · dodge the noise · catch the trends</p></div>
 </div>
 <div class="slope" id="slope"><span class="tr" id="mq">TRENDSLOPE</span></div>
</header>
<button id="burger" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
<nav id="menu" aria-label="Sites">
 <a href="#/movies"><i style="background:#7B2CBF"></i>Movies</a><a href="#/music"><i style="background:#E0359B"></i>Music</a><a href="#/software"><i style="background:#0B7285"></i>Software</a><a href="#/trends"><i style="background:#F08C00"></i>Trending Topics</a><a href="#/deals"><i style="background:#D9480F"></i>Slickdeals</a><a href="#/sports"><i style="background:#1B63E0"></i>Sports</a><a href="#/diet"><i style="background:#1E9E5A"></i>Single Man&rsquo;s Diet</a>
</nav>
<div id="siteview"><iframe id="siteframe" title="Site" src="about:blank"></iframe></div>
<button id="back" type="button" aria-label="Return to main page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg> Main page</button>

<main>
 <div class="controls">
  <div class="tabs" id="tabs"></div>
  <div class="tabs" id="sorts"></div>
  <div class="tabs" id="ranges"></div>
  <div class="mono"><span id="count"></span></div>
 </div>
 <div class="srcs" id="srcs"></div>
 <div class="grid" id="grid"></div>
 <div id="more" style="min-height:1px;text-align:center;padding:10px 0 30px"><button class="btn" id="moreBtn" style="display:none"></button></div>
</main>
<script src="picks-store.js"></script>
<script src="diet-shared.js"></script>
<script>
// ===== CONFIG: change repo names / branch here =====
const U='mzaiger', BRANCH='main';
const RAW=r=>`https://raw.githubusercontent.com/${U}/${r}/${BRANCH}/`;
const SITEBASE=window.TS_BASE||'https://marcitech.is-a.dev/';
const SITE={diet:'SingleManDiet',trends:'TrendingTopics',movies:'Movies',music:'Music',software:'software',deals:'SlickDealsTracker',sports:'SportsDashboard'};
const TREND_FILES=[['social_media_trends.json','social_media'],['google_trends.json','google'],['reddit_trends.json','reddit']];
const COLORS={diet:'#1E9E5A',deals:'#D9480F',sports:'#1B63E0',movies:'#7B2CBF',music:'#E0359B',software:'#0B7285',trends:'#F08C00'};
const SLOTS=[['Breakfast',8],['Brunch',10],['Lunch',12],['Dinner',19],['Late dinner',22]];
const DAY0=864e5;
const WINS=[['1h',36e5,'1 hour'],['1d',DAY0,'1 day'],['1w',7*DAY0,'1 week'],['1m',30*DAY0,'1 month']];
const SORTS=[['rank','Ranking'],['new','Newest']];
// ===== helpers =====
const DAY=864e5; let now=Date.now();
const gc=(k,f)=>{const m=document.cookie.match('(?:^|; )'+k+'=([^;]*)');try{return m?JSON.parse(decodeURIComponent(m[1])):f}catch{return f}};
const sc=(k,v)=>{document.cookie=`${k}=${encodeURIComponent(JSON.stringify(v))};max-age=31536000;path=/;SameSite=Lax`};
const hs=s=>{let h=2166136261;for(const c of String(s)){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967296};
const J=async u=>{try{const r=await fetch(u+'?v='+Math.floor(now/3e5));return r.ok?await r.json():null}catch{return null}};
const pick=o=>({title:o.title||o.name||o.topic||o.query||o.meal||o.item||'',img:o.image||o.img||o.poster||o.thumb||o.logo||'',url:o.url||o.link||'',desc:o.desc||o.description||o.summary||''});
const arr=(o,d=0)=>{if(Array.isArray(o)&&o.length>2&&o[0]&&typeof o[0]=='object'&&pick(o[0]).title)return o;if(o&&typeof o=='object'&&d<4)for(const v of Object.values(o)){const r=arr(v,d+1);if(r)return r}};
const lim=(a,n)=>a.slice(0,n);
let S={tab:gc('ts_tab','live'),sort:gc('ts_sort2','rank'),win:gc('ts_win','1w'),hide:gc('ts_hide',[])};
if(!Array.isArray(S.hide))S.hide=[];
if(!['live','fav'].includes(S.tab))S.tab='live';if(!['new','rank'].includes(S.sort))S.sort='new';if(!WINS.some(w=>w[0]==S.win))S.win='1w';
let ITEMS=[],GSET=new Set(),SHOWN=60,LASTTOTAL=0,MROWS=[],MBOARD=[];const CUR=new Map(),MDET={};
const dts=d=>{if(!d)return NaN;const m=String(d).match(/^(\d{4})-(\d\d)-(\d\d)$/);return m?new Date(+m[1],m[2]-1,+m[3],12).getTime():Date.parse(d)};
// ===== favorites: same localStorage keys/formats as each site, so they show on the other pages =====
const LS=(k,f)=>{try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch{return f}},LW=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const mut=(k,fb,fn)=>{const o=LS(k,fb);fn(o);LW(k,o)};
const kM=i=>i.fk||('all:'+i.raw.id),kS=i=>i.fk||(i.f+':'+i.raw.id),kT=i=>i.sk+'|'+i.raw.id;
const FAV={
 movies:{is:i=>LS('movies_favs',[]).includes(i.raw.id),set:(i,on)=>mut('movies_favs',[],a=>{const x=new Set(a);on?x.add(i.raw.id):x.delete(i.raw.id);a.length=0;a.push(...x)})},
 music:{is:i=>kM(i)in LS('music_favs',{}),set:(i,on)=>mut('music_favs',{},o=>{const k=kM(i);on?o[k]={...i.raw,rank:i.rank,src:'all'}:delete o[k]})},
 software:{is:i=>kS(i)in LS('software_favs2',{}),set:(i,on)=>mut('software_favs2',{},o=>{const k=kS(i);on?o[k]={...i.raw,src:i.f}:delete o[k]})},
 trends:{is:i=>kT(i)in LS('trending_favorites',{}),set:(i,on)=>mut('trending_favorites',{},o=>{const u=kT(i);on?o[u]={...i.raw,source:i.sk,uid:u}:delete o[u]})},
 deals:{is:i=>i.raw.link in LS('slickdeals_favorites',{}),set:(i,on)=>mut('slickdeals_favorites',{},o=>{on?o[i.raw.link]=i.raw:delete o[i.raw.link]})}};
const isFav=i=>FAV[i.src]?FAV[i.src].is(i):false;
const SC={};
const tsTrend=(o,l)=>Date.parse(l=='reddit'?(o.started_trending||o.first_seen):(o.published||o.started_trending||o.first_seen));
// items favorited on the other sites that are not in today's data: rebuilt from the snapshots those sites saved
function extras(){const out=[],have=new Set(ITEMS.map(x=>x.id));
 for(const[k,v]of Object.entries(LS('music_favs',{})))if(v&&v.id&&!have.has('mu'+v.id)){const t=dts(v.date);out.push({id:'mu'+v.id,src:'music',raw:v,rank:v.rank||null,title:v.title,ts:isNaN(t)?now:t,fk:k})}
 for(const[k,v]of Object.entries(LS('software_favs2',{})))if(v&&v.id&&SW[v.src]&&!have.has('sw'+v.src+v.id)){const t=dts(v.date);out.push({id:'sw'+v.src+v.id,src:'software',f:v.src,raw:v,rank:(v.ranks&&(v.ranks['12']??v.ranks['0']))||null,title:v.title,ts:isNaN(t)?now:t,fk:k})}
 for(const v of Object.values(LS('trending_favorites',{})))if(v&&v.id&&v.source&&!have.has('tr'+v.source+v.id)){const t=tsTrend(v,v.source);out.push({id:'tr'+v.source+v.id,src:'trends',sk:v.source,raw:v,rank:+v.rank||null,title:v.topic,ts:isNaN(t)?now:t})}
 for(const v of Object.values(LS('slickdeals_favorites',{})))if(v&&v.link&&!have.has('dl'+v.link.slice(-50))){const t=Date.parse(v.pubDateIso);out.push({id:'dl'+v.link.slice(-50),src:'deals',raw:v,rank:null,title:v.title,ts:isNaN(t)?now:t})}
 return out}
// ===== loaders (each pushes items and re-renders as it arrives) =====
const add=(a)=>{ITEMS.push(...a);render()};
async function monthLoad(ym){if(MDET[ym])return;MDET[ym]=new Map();const d=await J(RAW(SITE.movies)+`data/${ym}.json`);(d&&d.items||[]).forEach(m=>MDET[ym].set(m.id,m))}
// a scores.json row can repeat an id (a re-dated release): the tile uses the row's own release date and scores, so it matches its rank
function mvItem(row){const det=(MDET[row.release.slice(0,7)]||new Map()).get(row.id)||Object.values(MDET).map(m=>m.get(row.id)).find(Boolean);if(!det)return null;
 return{id:`mv${row.id}_${row.release}`,src:'movies',raw:{...det,release:row.release,rt:row.rt,imdb:row.imdb,box:row.box,score:row.score},rank:row.rank||null,title:det.title,ts:dts(row.release)}}
async function favMovies(){const have=new Set(ITEMS.filter(x=>x.src=='movies').map(x=>x.raw.id)),rows=[];
 for(const id of LS('movies_favs',[])){if(have.has(id))continue;const r=MROWS.filter(x=>x.id===id).sort((a,b)=>(b.rank?1:0)-(a.rank?1:0)||(b.release>a.release?1:-1))[0];if(r)rows.push(r)}
 for(const ym of new Set(rows.map(r=>r.release.slice(0,7))))await monthLoad(ym);add(rows.map(mvItem).filter(Boolean))}
async function movies(){const sc=await J(RAW(SITE.movies)+'data/scores.json');if(!sc)return;
 const c=Object.fromEntries(sc.cols.map((k,i)=>[k,i]));MROWS=sc.rows.map(r=>({id:r[c.id],release:r[c.release],rt:r[c.rt],imdb:r[c.imdb],box:r[c.box],score:r[c.score]})).filter(r=>r.release);
 // the Movies site's overall board: last 3 months, at least 2 of its 3 scores, ranked by average score
 const cut=new Date(now-3*30.44*DAY).toISOString().slice(0,10),n=m=>[m.rt,m.imdb,m.box].filter(v=>v!=null&&Number.isFinite(Number(v))).length;
 MBOARD=MROWS.filter(m=>m.release>=cut&&n(m)>=2).sort((a,b)=>b.score-a.score||a.id-b.id);MBOARD.forEach((m,k)=>{m.rank=k+1});
 const from=new Date(now-32*DAY).toISOString().slice(0,10),to=new Date(now+DAY).toISOString().slice(0,10),rows=MBOARD.filter(m=>m.release>=from&&m.release<=to);
 await Promise.all([...new Set(rows.map(r=>r.release.slice(0,7)))].map(monthLoad));add(rows.map(mvItem).filter(Boolean));await favMovies()}
async function music(){const d=await J(RAW(SITE.music)+'data/all.json');if(!d)return;
 add(d.items.map((i,n)=>({id:'mu'+i.id,src:'music',raw:i,rank:i.rank||n+1,title:i.title,ts:i.date?dts(i.date):NaN})).filter(x=>!isNaN(x.ts)))}
async function software(){for(const f of['github','steam','itunes']){const d=await J(RAW(SITE.software)+`data/${f}.json`);if(d)add(d.items.filter(i=>i.date).map((i,n)=>({id:'sw'+f+i.id,src:'software',f,raw:i,rank:(i.ranks&&(i.ranks['12']??i.ranks['0']))||n+1,title:i.title,ts:dts(i.date)})))}}
async function deals(){try{const r=await fetch(RAW(SITE.deals)+'deals.xml?v='+Math.floor(now/3e5));const x=new DOMParser().parseFromString(await r.text(),'text/xml');
 const L=[...x.querySelectorAll('deal')].map(e=>{const g=t=>(e.querySelector(t)?.textContent||'').trim(),p=Date.parse(g('pubDateIso'));return{id:'dl'+g('link').slice(-50),src:'deals',title:g('title'),raw:{title:g('title'),link:g('link'),thumbnail:g('thumbnail'),rating:+g('rating')||0,description:g('description'),pubDateIso:g('pubDateIso')},ts:p}}).filter(i=>i.raw.link&&!isNaN(i.ts));
 [...L].sort((a,b)=>b.raw.rating-a.raw.rating||b.ts-a.ts).forEach((i,k)=>{i.rank=k+1});add(L)}catch{}}

function fmtAmerican(n) {

function fmtLine(n) {

function splitTeamName(name, location) {
  if (!name) return ['', ''];
  if (location && name.length > location.length + 1 && name.startsWith(location + ' ')) {
    return [location, name.slice(location.length + 1)];
  }
  const words = name.split(' ');
  if (words.length < 2) return [name, ''];
  if (words.length > 2 && MULTI_WORD_MASCOTS.has(words.slice(-2).join(' '))) {
    return [words.slice(0, -2).join(' '), words.slice(-2).join(' ')];
  }
  return [words.slice(0, -1).join(' '), words[words.length - 1]];
}

function providerKey(name) {
  return String(name).toLowerCase()
    .replace(/\s+(amazon|apple tv|roku premium|youtube primetime)\s+channel$/, '')   // "Max Amazon Channel" -> "max"
    .replace(/\s+apple tv$/, '')                                                     // "Acorn TV Apple TV" -> "acorn tv"
    .replace(/\s+(standard |basic |premium )?with ads$/, '')                         // "Netflix Standard with Ads" -> "netflix"
    .replace(/\s+(premium plus|premium|basic|standard|essential|select)$/, '')       // "Peacock Premium" -> "peacock"
    .trim();
}

// One link per service, in TMDb's order. Services we have no search URL for share a single JustWatch link.
function watchLinks(m) {
  const t = encodeURIComponent(m.title), seen = new Set(), out = [];
  let other = false;
  (m.stream || []).forEach(n => {
    const key = providerKey(n), sv = SERVICES.find(x => x.re.test(key));
    if (!sv) { other = true; return; }
    if (seen.has(sv.k)) return;
    seen.add(sv.k);
    out.push({ href: sv.url(t), domain: sv.domain, img: sv.img, name: sv.name });
  });
  if (other) out.push({ href: `https://www.justwatch.com/us/search?q=${t}`, domain: 'justwatch.com', name: 'JustWatch' });
  return [{ href: `https://www.fandango.com/search?q=${t}`, domain: 'fandango.com', name: 'Fandango' }, ...out];   // tickets first, then the streaming services
}
