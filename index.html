<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trendslope</title>
<link rel="icon" type="image/gif" href="favicon.gif">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--panel:#F2F7FD;--line:#D9E5F2;--text:#10233F;--dim:#64798E;--blue:#1B63E0;--radius:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
/* boogie header */
.disco{position:relative;overflow:hidden;color:#fff;background:linear-gradient(120deg,#2a0a4a,#6a11cb 35%,#ff2fa0 70%,#ffb347);background-size:300% 300%;animation:shift 12s ease infinite;clip-path:polygon(0 0,100% 0,100% 78%,0 100%);padding-bottom:46px}
@keyframes shift{50%{background-position:100% 50%}}
.disco:before{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.35) 1px,transparent 2px) 0 0/26px 26px;animation:twinkle 2.4s linear infinite;opacity:.5}
@keyframes twinkle{50%{opacity:.15}}
.hero{position:relative;max-width:1700px;margin:0 auto;padding:18px 24px 10px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.hero img{width:240px;max-width:44vw;height:auto;border-radius:14px;border:3px solid #00ffd0;box-shadow:0 0 24px #ff2fa0,0 0 8px #00ffd0;transform:rotate(-3deg)}
h1{font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(40px,9vw,84px);line-height:.9;margin:0;letter-spacing:.03em;text-shadow:3px 3px 0 #ff2fa0,6px 6px 0 #1B63E0,0 0 28px #fff8}
.tag{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;margin:10px 0 0;color:#00ffd0}
.marq{position:relative;white-space:nowrap;overflow:hidden;font-family:Oswald;letter-spacing:.2em;font-size:13px;opacity:.9;padding:4px 0}
.marq span{display:inline-block;animation:mq 28s linear infinite}
@keyframes mq{to{transform:translateX(-50%)}}
main{max-width:1700px;margin:0 auto;padding:0 24px 60px}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;padding:10px 0;background:linear-gradient(var(--bg) 78%,transparent)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.tab{font-family:Oswald;font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:13px;color:var(--dim);background:none;border:0;border-radius:999px;padding:7px 15px}
.tab.on{background:var(--blue);color:#fff}
.mono{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim)}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--blue);border-radius:6px;padding:6px 11px;font-family:'IBM Plex Mono',monospace;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:8px}
.tc{position:relative;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:0 1px 2px rgba(16,35,63,.04);color:inherit;text-decoration:none}
.tc:hover{border-color:var(--blue)}
.th{position:relative;aspect-ratio:4/3;background:var(--panel);overflow:hidden;display:flex;align-items:center;justify-content:center}
.th img{width:100%;height:100%;object-fit:cover}
.th.logo img{object-fit:contain;padding:18px}
.th .fb{font-family:Oswald;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-size:12px;padding:10px;text-align:center}
.pill{position:absolute;left:8px;bottom:8px;border-radius:999px;padding:3px 10px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:#fff}
.when{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-family:'IBM Plex Mono',monospace;font-size:11.5px}
.star{position:absolute;left:8px;top:8px;background:rgba(255,255,255,.93);border:1px solid var(--line);border-radius:999px;width:30px;height:30px;font-size:16px;line-height:1;color:#bbb}
.star.on{color:#F2A93B}
.bd{padding:10px 12px 12px}
.bd b{display:block;font-size:14px;line-height:1.3}
.bd span{display:block;color:var(--dim);font-size:12.5px;margin-top:4px;font-family:'IBM Plex Mono',monospace;line-height:1.45}
.s-movies{display:block; --bg:#FFFFFF; --panel:#F2F7FD; --line:#D9E5F2; --text:#10233F; --text-dim:#64798E; --blue:#1B63E0; --warm:#F2A93B; --radius:10px; ;color:var(--text);font-family:'Inter',system-ui,sans-serif;}
.s-movies .card{ position:relative; display:flex; flex-direction:column; background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:0 1px 2px rgba(16,35,63,.04); }
.s-movies .thumb-wrap{ position:relative; aspect-ratio:2/3; background:var(--panel); overflow:hidden; }
.s-movies .thumb-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
.s-movies .thumb-fallback{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); }
.s-movies .stream-pill{ position:absolute; left:8px; bottom:8px; z-index:2; border-radius:999px; padding:3px 10px; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; background:#1E9E5A; color:#fff; }
.s-movies .stream-pill.rent{ background:rgba(255,255,255,.93); color:var(--text-dim); border:1px solid var(--line); }
.s-movies .rank-pill{ position:absolute; top:8px; right:8px; z-index:2; background:rgba(255,255,255,.93); border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:500; }
.s-movies .dates{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--text-dim); margin:8px 0 0; line-height:1.55; }
.s-movies .dates b{ font-weight:600; color:var(--text); }
.s-movies .watch-label{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; color:#1E7A4D; margin:10px 0 0; }
.s-movies .links.watch,.s-movies .links.scores{ margin-top:6px; }
.s-movies .fav-toggle{ position:absolute; top:8px; left:8px; z-index:3; width:38px; height:38px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.93); border:1px solid var(--line); border-radius:999px; cursor:pointer; }
.s-movies .fav-toggle input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; }
.s-movies .fav-star{ font-size:20px; line-height:1; color:var(--text-dim); pointer-events:none; transition:color .15s ease, transform .15s ease; }
.s-movies .fav-toggle input:checked ~ .fav-star{ color:var(--warm); transform:scale(1.1); }
.s-movies .fav-toggle input:focus-visible ~ .fav-star{ outline:2px solid var(--blue); border-radius:4px; }
.s-movies .body{ padding:12px 14px 13px; display:flex; flex-direction:column; flex:1; }
.s-movies .title{ font-size:15.5px; line-height:1.3; font-weight:600; margin:0 0 6px; }
.s-movies .desc{ font-size:12px; line-height:1.4; color:#3B5169; margin:0 0 10px; overflow-wrap:anywhere; }
.s-movies .desc.none{ font-style:italic; opacity:.8; }
.s-movies .desc.clamp{ display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:4px; }
.s-movies .more{ align-self:flex-start; position:relative; z-index:2; background:none; border:none; padding:0; margin:0 0 8px; color:var(--blue); font-family:'IBM Plex Mono',monospace; font-size:11.5px; }
.s-movies .more:hover{ text-decoration:underline; }
.s-movies .more[hidden]{ display:none; }
.s-movies .chips{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; width:100%; margin:auto 0 0; }
.s-movies .chip{ background:var(--panel); border:1px solid var(--line); border-radius:7px; padding:8px 2px; min-width:0; width:100%; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; }
.s-movies .chip small{ display:block; font-size:11px; font-weight:500; color:var(--text-dim); letter-spacing:.06em; text-transform:uppercase; margin-bottom:2px; }
.s-movies .meta{ display:flex; justify-content:space-between; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-dim); }
.s-movies .links{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; width:100%; margin-top:10px; }
.s-movies .links a{ display:flex; align-items:center; justify-content:center; gap:6px; min-width:0; height:46px; background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--blue); text-decoration:none; font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; transition:border-color .15s ease, background .15s ease; }
.s-movies .links a:hover{ border-color:var(--blue); background:#fff; }
.s-movies .links a:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
.s-movies .links img{ width:28px; height:28px; display:block; flex:none; }
.s-movies .links img.logo{ width:auto; height:auto; max-width:calc(100% - 24px); max-height:32px; object-fit:contain; border-radius:4px; }
.s-movies .links .arrow{ font-size:17px; line-height:1; }
@media (prefers-reduced-motion:reduce){.s-movies .fav-star,.s-movies .links a{ transition:none; }}
.s-music{display:block; --hot:#E4572E; --bg:#FFFFFF; --panel:#F2F7FD; --line:#D9E5F2; --text:#10233F; --text-dim:#64798E; --blue:#1B63E0; --warm:#F2A93B; --radius:10px; ;color:var(--text);font-family:'Inter',system-ui,sans-serif;}
.s-music .tr{ font-size:11px; font-weight:600; margin-left:5px; }
.s-music .tr.up{ color:#1f9d55; }
.s-music .tr.down{ color:#d64545; }
.s-music .tr.new{ color:var(--blue); }
.s-music .tr.same{ color:var(--text-dim); }
.s-music .thumb-wrap.youtube{ aspect-ratio:16/9; }
.s-music .artist{ font-size:12.5px; color:var(--text-dim); margin:-2px 0 6px; overflow-wrap:anywhere; }
.s-music .links{ display:flex; flex-wrap:wrap; gap:5px; margin-top:auto; }
.s-music .lk{ flex:1 1 auto; text-align:center; padding:7px 8px; background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--blue); text-decoration:none; font-family:'IBM Plex Mono',monospace; font-size:11.5px; font-weight:600; white-space:nowrap; }
.s-music .lk:hover{ border-color:var(--blue); background:#fff; }
.s-music .lk.s{ color:var(--text-dim); font-weight:500; }
.s-music .chips{ display:flex; flex-wrap:wrap; gap:4px; margin-top:8px; }
.s-music .chip{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; padding:2px 7px; border:1px solid var(--line); border-radius:999px; color:var(--text-dim); background:var(--panel); }
.s-music .card{ position:relative; display:flex; flex-direction:column; background:#fff; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:0 1px 2px rgba(16,35,63,.04); }
.s-music .thumb-wrap{ position:relative; aspect-ratio:1/1; background:var(--panel); overflow:hidden; }
.s-music .thumb-wrap.steam{ aspect-ratio:460/215; }
.s-music .thumb-wrap img{ width:100%; height:100%; object-fit:cover; display:block; }
.s-music .thumb-fallback{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-dim); }
.s-music .rank-pill{ position:absolute; top:8px; right:8px; z-index:2; background:rgba(255,255,255,.93); border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:500; }
.s-music .fav-toggle{ position:absolute; top:8px; left:8px; z-index:3; width:38px; height:38px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.93); border:1px solid var(--line); border-radius:999px; cursor:pointer; }
.s-music .fav-toggle input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; }
.s-music .fav-star{ font-size:20px; line-height:1; color:var(--text-dim); pointer-events:none; transition:color .15s ease, transform .15s ease; }
.s-music .fav-toggle input:checked ~ .fav-star{ color:var(--warm); transform:scale(1.1); }
.s-music .fav-toggle input:focus-visible ~ .fav-star{ outline:2px solid var(--blue); border-radius:4px; }
.s-music .body{ padding:12px 14px 13px; display:flex; flex-direction:column; flex:1; }
.s-music .title{ font-size:15.5px; line-height:1.3; font-weight:600; margin:0 0 6px; overflow-wrap:anywhere; }
.s-music .title a{ color:inherit; text-decoration:none; }
.s-music .title a:hover{ color:var(--blue); text-decoration:underline; }
.s-music .desc{ font-size:12px; line-height:1.4; color:#3B5169; margin:0 0 10px; overflow-wrap:anywhere; }
.s-music .desc.clamp{ display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:4px; }
.s-music .more{ align-self:flex-start; background:none; border:none; padding:0; margin:0 0 8px; color:var(--blue); font-family:'IBM Plex Mono',monospace; font-size:11.5px; }
.s-music .more:hover{ text-decoration:underline; }
.s-music .more[hidden]{ display:none; }
.s-music .open-link{ display:flex; align-items:center; justify-content:center; gap:6px; height:40px; margin-top:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; color:var(--blue); text-decoration:none; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; transition:border-color .15s ease, background .15s ease; }
.s-music .open-link:hover{ border-color:var(--blue); background:#fff; }
.s-music .meta{ display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--text-dim); }
.s-music .meta b{ color:var(--text); font-weight:600; }
.s-music .thumb-wrap > a.thumb-link{ display:block; width:100%; height:100%; }
@media (prefers-reduced-motion:reduce){.s-music .fav-star,.s-music .open-link{ transition:none; }}
.s-trends{display:block;
    --bg:        #FFFFFF;
    --panel:     #F2F7FD;
    --line:      #D9E5F2;
    --text:      #10233F;
    --text-dim:  #64798E;
    --blue:      #1B63E0;
    --warm:      #F2A93B;
    --up:        #1E9E5A;
    --down:      #E4572E;
    --radius:    10px;
  ;color: var(--text);font-family: 'Inter', system-ui, sans-serif;}
.s-trends .card{
    position: relative; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden; color: inherit;
    box-shadow: 0 1px 2px rgba(16,35,63,0.04);
    transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
.s-trends .card:hover{ border-color: var(--blue); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(27,99,224,0.12); }
.s-trends .thumb-wrap{ position: relative; aspect-ratio: 16 / 9; background: var(--panel); overflow: hidden; }
.s-trends .thumb-wrap img{ width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.s-trends .thumb-fallback{
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    font-family: 'Oswald', sans-serif; font-size: 12px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-dim);
  }
.s-trends .rank-pill{
    position: absolute; top: 8px; right: 8px; z-index: 2; display: flex; align-items: center; gap: 7px;
    background: rgba(255,255,255,0.93); backdrop-filter: blur(2px); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px; font-family: 'IBM Plex Mono', monospace;
    font-size: 15px; font-weight: 500; color: var(--text);
  }
.s-trends .rank-pill.saved{ font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.06em; }
.s-trends .chg{ font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.s-trends .chg.up{ color: var(--up); }
.s-trends .chg.down{ color: var(--down); }
.s-trends .chg.same{ color: var(--text-dim); }
.s-trends .chg.new{ color: #FFFFFF; background: var(--blue); border-radius: 4px; padding: 1px 5px; font-size: 10px; letter-spacing: 0.06em; }
.s-trends .body{ padding: 12px 14px 13px; display: flex; flex-direction: column; flex: 1; }
.s-trends .title{
    font-size: 15.5px; line-height: 1.3; font-weight: 600; margin: 0 0 6px; color: var(--text);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
.s-trends .desc{ font-size: 14px; line-height: 1.5; color: #3B5169; margin: 0 0 10px; overflow-wrap: anywhere; }
.s-trends .desc.none{ font-style: italic; opacity: 0.8; }
.s-trends .meta-block{ margin-top: auto; padding-top: 6px; display: flex; flex-direction: column; gap: 3px; }
.s-trends .meta{
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim);
  }
.s-trends .meta .go{ color: var(--blue); }
.s-trends .meta .when,.s-trends .meta .vol{ white-space: nowrap; }
.s-trends .srctag{ text-transform: uppercase; letter-spacing: 0.06em; font-size: 10px; }
.s-trends .archived-tag{ font-style: italic; }
.s-trends .fav-toggle{
    position: absolute; top: 8px; left: 8px; z-index: 3; display: flex; align-items: center;
    justify-content: center; width: 38px; height: 38px; background: rgba(255,255,255,0.93);
    backdrop-filter: blur(2px); border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
  }
.s-trends .fav-toggle input{ position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.s-trends .fav-toggle .fav-star{
    font-size: 20px; line-height: 1; color: var(--text-dim);
    transition: color 0.15s ease, transform 0.15s ease; pointer-events: none;
  }
.s-trends .fav-toggle input:checked ~ .fav-star{ color: var(--warm); transform: scale(1.1); }
.s-trends .fav-toggle input:focus-visible ~ .fav-star{ outline: 2px solid var(--blue); border-radius: 4px; }
@media (prefers-reduced-motion: reduce){.s-trends .card{ transition: none; }}

  { k:'tubi',      re:/tubi/,                            name:'Tubi',           domain:'tubitv.com',         url:q => `https://tubitv.com/search/${q}` },
  { k:'pluto',     re:/pluto/,                           name:'Pluto TV',       domain:'pluto.tv',           url:q => `https://pluto.tv/us/search/details?query=${q}` },
  { k:'roku',      re:/roku/,                            name:'The Roku Channel', domain:'therokuchannel.roku.com', url:q => `https://therokuchannel.roku.com/search/${q}` },
  { k:'youtube',   re:/youtube/,                         name:'YouTube',        domain:'youtube.com',        url:q => `https://www.youtube.com/results?search_query=${q}` },
  { k:'crunchy',   re:/crunchyroll/,                     name:'Crunchyroll',    domain:'crunchyroll.com',    url:q => `https://www.crunchyroll.com/search?q=${q}` },
  { k:'criterion', re:/criterion/,                       name:'Criterion Channel', domain:'criterionchannel.com', url:q => `https://www.criterionchannel.com/search?q=${q}` },
  { k:'amc',       re:/^amc/,                            name:'AMC+',           domain:'amcplus.com', img:RAW(SITE.movies)+'img/amc-plus.png', url:q => `https://www.amcplus.com/search?q=${q}` },
];

function providerKey(name) {
  return String(name).toLowerCase()
    .replace(/\s+(amazon|apple tv|roku premium|youtube primetime)\s+channel$/, '')   // "Max Amazon Channel" -> "max"
    .replace(/\s+apple tv$/, '')                                                     // "Acorn TV Apple TV" -> "acorn tv"
    .replace(/\s+(standard |basic |premium )?with ads$/, '')                         // "Netflix Standard with Ads" -> "netflix"
    .replace(/\s+(premium plus|premium|basic|standard|essential|select)$/, '')       // "Peacock Premium" -> "peacock"
    .trim();
}

// One link per service, in TMDb's order. Services we have no search URL for share a single JustWatch link.
function watchLinks(m) {
  const t = encodeURIComponent(m.title), seen = new Set(), out = [];
  let other = false;
  (m.stream || []).forEach(n => {
    const key = providerKey(n), sv = SERVICES.find(x => x.re.test(key));
    if (!sv) { other = true; return; }
    if (seen.has(sv.k)) return;
    seen.add(sv.k);
    out.push({ href: sv.url(t), domain: sv.domain, img: sv.img, name: sv.name });
  });
  if (other) out.push({ href: `https://www.justwatch.com/us/search?q=${t}`, domain: 'justwatch.com', name: 'JustWatch' });
  return [{ href: `https://www.fandango.com/search?q=${t}`, domain: 'fandango.com', name: 'Fandango' }, ...out];   // tickets first, then the streaming services
}

music:i=>{const it=i.raw,L=it.links||{},q=encodeURIComponent(`${it.title} ${it.artist}`),u=safeUrl(Object.values(L)[0]),
 defs=[['spotify','Spotify',`https://open.spotify.com/search/${q}`],['itunes','Apple',`https://music.apple.com/us/search?term=${q}`],['video','Video',`https://www.youtube.com/results?search_query=${q}`],['billboard','Billboard','']],

 return`<article class="card"><div class="thumb-wrap all">${u?`<a class="thumb-link" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${imgT(it.image)}</a>`:imgT(it.image)}${favT(i)}<div class="rank-pill">#${i.rank}</div></div><div class="body"><p class="title">${esc(it.title)}</p><p class="artist">${esc(it.artist)}</p><p class="desc clamp">${esc(it.desc||'No description provided.')}</p><div class="links">${lk}</div><div class="meta"><span>${esc(fmtDate(it.date))}</span><span>${typeof it.metric=='number'?`<b>\u2605 ${it.metric.toFixed(1)}</b> score \u00b7 ${it.n}/${it.of} charts`:''}</span></div><div class="chips">${c.map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div></div></article>`},
